[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechbench"
version = "0.1.0"
description = "A package to run MECHBench benchmarks for black-box optimization algorithms"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

dependencies = [
  "requests",
  "gmsh",
  "vtk",
  "numpy",
  "ioh",
  "pandas",
  "importlib-metadata; python_version < '3.11'"
]

[project.urls]
Homepage = "https://anonymous.4open.science/r/MECHBench-TELO_submission"

[project.optional-dependencies]
hdbo = [
  "botorch",
  "gpytorch",
  "torch",
  "matplotlib",
  "hebo",
  "cma",
  "bayes-optim",
  "pyDOE",
  "pyDOE2"
]

ela = [
  "pflacco"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["results*", "examples*", "tools*", "docs*", "tests*"]