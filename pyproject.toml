[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechbench"
version = "0.1.0"
description = "A package to run MECHBench benchmarks for black-box optimization algorithms"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Elena Raponi", email = "e.raponi@liacs.leidenuniv.nl" },
  { name = "Ivan Olarte Rodriguez", email = "i.olarte.rodriguez@liacs.leidenuniv.nl" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

dependencies = [
  "requests",
  "gmsh",
  "vtk",
  "numpy",
  "ioh",
  "pandas",
  "importlib-metadata; python_version < '3.10'"
]

[project.urls]
Homepage = "https://github.com/BayesOptApp/MECHBench"
Issues = "https://github.com/BayesOptApp/MECHBench/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["results*", "examples*", "tools*", "docs*", "tests*"]